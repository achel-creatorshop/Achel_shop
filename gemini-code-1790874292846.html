<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achel Shop - Ibikoresho bya Electronics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .cart-drawer { transition: transform 0.3s ease-in-out; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

  <!-- Header / Navigation -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center justify-between w-full md:w-auto">
        <h1 class="text-2xl font-bold tracking-wider text-blue-400 flex items-center gap-2">
          <i class="fa-solid font-bold fa-bolt"></i> ACHEL SHOP
        </h1>
        <button id="cart-btn-mobile" onclick="toggleCart()" class="md:hidden relative text-gray-300 hover:text-white">
          <i class="fa-solid fa-cart-shopping text-2xl"></i>
          <span id="cart-count-mobile" class="absolute -top-2 -right-2 bg-blue-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">0</span>
        </button>
      </div>

      <!-- Search Bar -->
      <div class="relative w-full md:w-1/2">
        <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="Shakisha mudasobwa, telephone, headphones..." class="w-full pl-10 pr-4 py-2 rounded-lg text-gray-900 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
      </div>

      <!-- Cart Desktop Button -->
      <button onclick="toggleCart()" class="hidden md:flex items-center gap-2 bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg font-medium transition">
        <i class="fa-solid fa-cart-shopping"></i>
        <span>Icyangombwa</span>
        <span id="cart-count" class="bg-white text-blue-600 font-bold text-xs px-2 py-0.5 rounded-full">0</span>
      </button>
    </div>
  </header>

  <!-- Banner -->
  <section class="bg-gradient-to-r from-blue-900 to-indigo-800 text-white py-12 px-4 text-center">
    <h2 class="text-3xl md:text-5xl font-extrabold mb-3">Duka Ligezweho ry'Ibikoresho bya Electronics</h2>
    <p class="text-blue-200 text-base md:text-lg max-w-2xl mx-auto">Gura ibikoresho bya none birimo Mudasobwa, Telefone, Isaha z'ubwenge, n'ibindi mu biciro byiza cyane mu Rwanda.</p>
  </section>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    
    <!-- Category Filter -->
    <div class="flex flex-wrap justify-center gap-2 mb-8">
      <button onclick="filterCategory('All')" class="cat-btn active bg-blue-600 text-white px-4 py-2 rounded-full font-medium text-sm transition hover:bg-blue-700">Byose</button>
      <button onclick="filterCategory('Laptops')" class="cat-btn bg-white text-gray-700 hover:bg-gray-100 border px-4 py-2 rounded-full font-medium text-sm transition">Mudasobwa (Laptops)</button>
      <button onclick="filterCategory('Phones')" class="cat-btn bg-white text-gray-700 hover:bg-gray-100 border px-4 py-2 rounded-full font-medium text-sm transition">Telefone (Smartphones)</button>
      <button onclick="filterCategory('Audio')" class="cat-btn bg-white text-gray-700 hover:bg-gray-100 border px-4 py-2 rounded-full font-medium text-sm transition">Audio & Headphones</button>
      <button onclick="filterCategory('Wearables')" class="cat-btn bg-white text-gray-700 hover:bg-gray-100 border px-4 py-2 rounded-full font-medium text-sm transition">Smartwatches</button>
    </div>

    <!-- Products Grid -->
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Dynamically generated via JS -->
    </div>
  </main>

  <!-- Shopping Cart Drawer -->
  <div id="cart-drawer" class="cart-drawer fixed top-0 right-0 h-full w-full sm:w-96 bg-white shadow-2xl z-50 transform translate-x-full flex flex-col">
    <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
      <h3 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-basket-shopping"></i> Icyangombwa cy'Ibyo Waguze</h3>
      <button onclick="toggleCart()" class="text-gray-400 hover:text-white text-xl">&times;</button>
    </div>

    <div id="cart-items" class="p-4 flex-grow overflow-y-auto space-y-4">
      <p class="text-gray-500 text-center py-8">Nta kintu kirazamo.</p>
    </div>

    <div class="p-4 border-t bg-gray-50">
      <div class="flex justify-between items-center text-lg font-bold mb-4">
        <span>Ayo Kwishyura:</span>
        <span id="cart-total" class="text-blue-600">0 RWF</span>
      </div>
      <button onclick="checkout()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow transition">
        Emeza no Kwishyura
      </button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-slate-900 text-gray-400 py-6 text-center border-t border-slate-800">
    <p>&copy; 2026 Achel Shop. All rights reserved.</p>
  </footer>

  <!-- JavaScript Application Logic -->
  <script>
    // Electronic Products Data
    const products = [
      { id: 1, name: "MacBook Pro 16\" M3", category: "Laptops", price: 2800000, img: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=500" },
      { id: 2, name: "iPhone 15 Pro Max", category: "Phones", price: 1650000, img: "https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=500" },
      { id: 3, name: "Sony WH-1000XM5 Headphones", category: "Audio", price: 420000, img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" },
      { id: 4, name: "Apple Watch Series 9", category: "Wearables", price: 550000, img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" },
      { id: 5, name: "Dell XPS 15 Laptop", category: "Laptops", price: 1950000, img: "https://images.unsplash.com/photo-1593642632823-8f785ba67e45?w=500" },
      { id: 6, name: "Samsung Galaxy S24 Ultra", category: "Phones", price: 1500000, img: "https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=500" },
      { id: 7, name: "AirPods Pro (2nd Gen)", category: "Audio", price: 320000, img: "https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=500" },
      { id: 8, name: "Samsung Galaxy Watch 6", category: "Wearables", price: 380000, img: "https://images.unsplash.com/photo-1508685096489-7aacd43bd3b1?w=500" }
    ];

    let cart = [];
    let activeCategory = 'All';

    // Render Products
    function renderProducts() {
      const grid = document.getElementById('product-grid');
      const searchVal = document.getElementById('search-input').value.toLowerCase();

      const filtered = products.filter(p => {
        const matchesCat = activeCategory === 'All' || p.category === activeCategory;
        const matchesSearch = p.name.toLowerCase().includes(searchVal);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">Nta gikoresho kibonetse gihuza n'ibyo ushakisha.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(product => `
        <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition border border-gray-100 flex flex-col justify-between">
          <img src="${product.img}" alt="${product.name}" class="h-48 w-full object-cover">
          <div class="p-4 flex-grow flex flex-col justify-between">
            <div>
              <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider">${product.category}</span>
              <h3 class="text-lg font-bold text-gray-800 mt-1">${product.name}</h3>
            </div>
            <div class="mt-4 flex justify-between items-center">
              <span class="text-lg font-extrabold text-slate-900">${product.price.toLocaleString()} RWF</span>
              <button onclick="addToCart(${product.id})" class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-lg transition">
                <i class="fa-solid fa-plus"></i>
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Category Filter Function
    function filterCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('bg-white', 'text-gray-700');
      });
      event.target.classList.add('bg-blue-600', 'text-white');
      event.target.classList.remove('bg-white', 'text-gray-700');
      renderProducts();
    }

    // Live Search
    function filterProducts() {
      renderProducts();
    }

    // Cart Operations
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const cartItem = cart.find(item => item.id === productId);

      if (cartItem) {
        cartItem.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }

      updateCartUI();
    }

    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      updateCartUI();
    }

    function changeQty(productId, delta) {
      const item = cart.find(i => i.id === productId);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) {
          removeFromCart(productId);
          return;
        }
      }
      updateCartUI();
    }

    function updateCartUI() {
      const countMobile = document.getElementById('cart-count-mobile');
      const countDesktop = document.getElementById('cart-count');
      const cartItems = document.getElementById('cart-items');
      const cartTotal = document.getElementById('cart-total');

      const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      countMobile.innerText = totalQty;
      countDesktop.innerText = totalQty;
      cartTotal.innerText = totalPrice.toLocaleString() + ' RWF';

      if (cart.length === 0) {
        cartItems.innerHTML = `<p class="text-gray-500 text-center py-8">Nta kintu kirazamo.</p>`;
        return;
      }

      cartItems.innerHTML = cart.map(item => `
        <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg border">
          <div>
            <h4 class="font-bold text-sm text-gray-800">${item.name}</h4>
            <p class="text-xs text-gray-500">${item.price.toLocaleString()} RWF</p>
            <div class="flex items-center gap-2 mt-2">
              <button onclick="changeQty(${item.id}, -1)" class="bg-gray-200 px-2 py-0.5 rounded font-bold text-xs">-</button>
              <span class="text-xs font-bold">${item.qty}</span>
              <button onclick="changeQty(${item.id}, 1)" class="bg-gray-200 px-2 py-0.5 rounded font-bold text-xs">+</button>
            </div>
          </div>
          <button onclick="removeFromCart(${item.id})" class="text-red-500 hover:text-red-700">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      `).join('');
    }

    function toggleCart() {
      const drawer = document.getElementById('cart-drawer');
      drawer.classList.toggle('translate-x-full');
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Icyangombwa cyanyu ntikirimwo ibikoresho!");
        return;
      }
      alert("Murakoze kugura kuri Achel Shop! Ibyo waguze birimo gutegurwa.");
      cart = [];
      updateCartUI();
      toggleCart();
    }

    // Initial Load
    renderProducts();
  </script>
</body>
</html>
